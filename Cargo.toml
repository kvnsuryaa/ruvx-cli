[package]
name = "ruvx"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small, provider-independent terminal coding agent"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
ignore = "0.4"
jsonwebtoken = "9.3"
nix = { version = "0.29", features = ["signal", "process"] }
rand = "0.8"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
axum = "0.8"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

