name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
          rustup default 1.89.0
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Release
        run: cargo build --release --locked
      - name: Terminal acceptance and resource targets
        run: python3 scripts/verify_terminal.py --binary target/release/ruvx --benchmark --output target/validation.json
